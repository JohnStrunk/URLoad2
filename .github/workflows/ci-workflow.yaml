---
# yamllint disable rule:line-length
name: "CI Workflow"

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Enable cache for pre-commit hooks
        # https://github.com/actions/cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # yamllint disable-line rule:line-length
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      - name: Run pre-commit checks
        run: pre-commit run -a

      - name: Run pre-commit gc
        run: pre-commit gc

  test:
    name: "Test (Go & godog)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  build:
    name: "Build urload2 binary"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Set up Go
        # https://github.com/actions/setup-go
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o bin/urload2 ./cmd/urload2
          file bin/urload2

  # This is a dummy job to determine success of the CI workflow
  ci-success:
    name: CI Workflow - Success
    if: always()
    needs:
      - pre-commit
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          for r in $RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "::error::❌ One or more required jobs failed, were cancelled, or were skipped ❌"
              exit 1
            fi
          done
          echo "✅ All required jobs succeeded ✅"
